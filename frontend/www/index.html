<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DWG 结构模型</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">DWG</span>
      <div>
        <strong>结构施工图 → 三维模型</strong>
        <p>上传图纸后，把图元和规则交给 DeepSeek 分析，再下载 SketchUp 或 Rhino 模型</p>
      </div>
    </div>
    <div class="status" id="status">
      <div data-key="zwcad"><span>中望 CAD</span><small>正在检查</small></div>
      <div data-key="sketchup"><span>SketchUp</span><small>正在检查</small></div>
      <div data-key="rhino"><span>Rhino</span><small>正在检查</small></div>
    </div>
  </header>

  <main>
    <ol class="steps">
      <li>上传 DWG</li>
      <li>DeepSeek 分析</li>
      <li>创建结构模型</li>
      <li>选择下载</li>
    </ol>

    <section class="card">
      <form id="form">
        <label class="drop" id="drop">
          <input id="file" type="file" accept=".dwg,application/acad">
          <span class="drop-title" id="dropTitle">选择或拖入 DWG</span>
          <span class="drop-hint">中望 CAD 读出图元，连同默认规则交给 DeepSeek 分析</span>
        </label>

        <div class="fields">
          <label>
            层高 mm
            <input id="story" name="story" type="number" min="500" max="20000" value="3000">
          </label>
          <label>
            板厚 mm
            <input id="slab" name="slab" type="number" min="40" max="800" value="130">
          </label>
        </div>

        <div class="actions">
          <button id="submit" type="submit">生成结构模型</button>
        </div>
        <div class="progress" id="progress" hidden>
          <div class="progress-head">
            <strong id="progressStage">正在准备</strong>
            <span id="progressTime">本步 00:00 · 总计 00:00</span>
          </div>
          <p id="progressDetail"></p>
          <ol id="progressLog"></ol>
        </div>
      </form>
      <p class="note">每次上传都会重新读图。读到的图元和默认梁、柱、墙、楼板规则会全部发给 DeepSeek 分析，再写入 SketchUp 和 Rhino。</p>
    </section>

    <section class="card result" id="result" hidden>
      <h2 id="resultTitle">模型已生成</h2>
      <dl id="counts"></dl>
      <p id="source"></p>
      <p id="warnings" class="warnings" hidden></p>
      <div class="downloads" id="downloads"></div>
    </section>

    <p class="error" id="error" hidden></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
